name: Deploy to VPS

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'staging' }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Build Docker image
        run: docker build -t clawdia-service:latest .

      - name: Save Docker image to tar
        run: docker save clawdia-service:latest -o clawdia-service.tar

      - name: Copy image to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "clawdia-service.tar"
          target: "/home/${{ secrets.VPS_USER }}/docker-tars/"
          overwrite: true
          tar: false

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker load -i /home/${{ secrets.VPS_USER }}/docker-tars/clawdia-service.tar
            if [ "${{ github.ref_name }}" = "development" ]; then
              echo "Deploying to staging..."
              docker stop clawdia-service-staging || true
              docker rm clawdia-service-staging || true
              docker run -d --restart always --name clawdia-service-staging -p 4110:3000 -e DATABASE_URL=${{ secrets.DATABASE_URL }} -e API_KEY=${{ secrets.API_KEY }} -e GOOGLE_GENERATIVE_AI_API_KEY=${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }} clawdia-service:latest
            elif [ "${{ github.ref_name }}" = "master" ]; then
              echo "Deploying to production..."
              docker stop clawdia-service-prod || true
              docker rm clawdia-service-prod || true
              docker run -d --restart always --name clawdia-service-prod -p 4100:3000 -e DATABASE_URL=${{ secrets.DATABASE_URL }} -e API_KEY=${{ secrets.API_KEY }} -e GOOGLE_GENERATIVE_AI_API_KEY=${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }} clawdia-service:latest
            fi
